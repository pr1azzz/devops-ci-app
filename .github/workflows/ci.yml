name: CI — verify and publish image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flake8
      - name: Lint with flake8
        run: flake8 app/ tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, devops-vm]
    permissions:
      contents: read
    concurrency:
      group: deploy-devops-vm
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      VM_HOST: 192.168.56.101
    steps:
      - name: Deploy with Ansible
        shell: bash
        run: |
          repo_dir="$(mktemp -d)"
          trap 'rm -rf -- "$repo_dir"' EXIT
          git init --quiet "$repo_dir"
          git -C "$repo_dir" fetch --quiet --no-tags --depth=1 \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$repo_dir" checkout --quiet --detach FETCH_HEAD
          cd "$repo_dir/ansible"
          ansible-playbook -i inventory/prod.ini site.yml -e "app_tag=$GITHUB_SHA"

      - name: Check through Nginx
        run: |
          curl --fail --silent --show-error --max-time 15 --noproxy "$VM_HOST" \
            "http://$VM_HOST/health"
