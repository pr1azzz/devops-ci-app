name: CI — verify and publish image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flake8
      - name: Lint with flake8
        run: flake8 app/ tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, devops-vm]
    permissions:
      contents: read
    concurrency:
      group: deploy-devops-vm
      cancel-in-progress: false
    env:
      VM_HOST: 192.168.56.101 # Убедитесь, что это ваш IP!
    steps:
      - name: Clone repository manually
        run: |
          rm -rf ./deploy_repo
          git clone https://github.com/${{ github.repository }}.git ./deploy_repo
          cd ./deploy_repo
          git checkout ${{ github.sha }}

      - name: Deploy with Ansible
        working-directory: ./deploy_repo/ansible
        run: |
          ansible-playbook -i inventory/prod.ini site.yml -e "app_tag=${{ github.sha }}"

      - name: Check through Nginx
        run: |
          curl -sf http://${{ env.VM_HOST }}/health || exit 1
